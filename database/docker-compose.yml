version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mondopt-db
    environment:
      POSTGRES_DB: mondopt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
